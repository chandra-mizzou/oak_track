# Physical setup
table_height_m: 0.75
# Optical center above the table surface (OAK-D body sitting on the table).
# Part A CSV still reports camera z = table_height_m as requested.
camera_optical_height_m: 0.03
# Object centroid above the table (set 0 to force the table plane).
object_height_m: 0.0

# Slide prior: camera moves mainly along world +X (table width).
slide_axis: x
still_time_s: 1.0

# Capture
fps: 30
color_size: [1280, 720]
mono_resolution: "800p"   # 400p is safer on USB2; 800p is more accurate
imu_rate_hz: 200
ir_dot_projector: true
save_depth: true

# Object detection: hsv | depth_blob | aruco
detector: hsv
hsv_lower: [0, 120, 70]
hsv_upper: [10, 255, 255]
hsv_lower2: [170, 120, 70]   # red wraps hue
hsv_upper2: [180, 255, 255]
aruco_id: 0
depth_min_m: 0.55
depth_max_m: 1.40

# Fusion weights
depth_weight: 0.25
smooth_weight: 5.0
slide_y_weight: 8.0
