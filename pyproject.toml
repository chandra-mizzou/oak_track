[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oak-track"
version = "0.1.0"
description = "OAK-D Pro W table-slide capture: IMU camera pose CSV and precise object localization"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scipy>=1.10",
]

[project.optional-dependencies]
device = ["depthai>=2.24.0"]
dev = ["pytest>=7.4"]
# Not required to write cloud.ply (numpy+opencv already do that).
# Install only if you want an interactive 3D viewer:
#   python -m pip install "oak-track[cloud]"
cloud = ["open3d>=0.17"]

[project.scripts]
oak-track = "oak_track.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
